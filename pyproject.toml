[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyrdforge"
# Version discipline (Phase A2, 2026-10-29): the package version tracks
# the WYRD advancement phases — 1.0.0 was the frozen pre-campaign
# version, 1.1.0 is Phase A, 1.2.0 is Phase B (completed at B5,
# 2026-10-29), 1.3.0 is Phase C (completed at C4, 2026-10-29),
# 1.4.0 is Phase D (completed at D6, 2026-10-29). Bump
# the minor per completed phase (patch
# for fixes within a phase); keep src/wyrdforge/__init__.__version__
# in step. Store schema versions (PRAGMA user_version) are separate
# and versioned per store.
version = "1.4.0"
description = "WYRD Protocol — World-Yielding Real-time Data AI World Model"
readme = "README.md"
license = { text = "CC BY 4.0" }
requires-python = ">=3.10"
# Per-dependency justification (Track 1, P3 — Wave G Slice 4):
dependencies = [
    "pydantic>=2.0",   # entity/world models, TruthMeta — core
    "pyyaml>=6.0",     # world-file YAML loading — core
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",          # test suite
    "pytest-asyncio>=0.23", # async relay/bridge tests
    "ruff>=0.4",            # lint
    "mypy>=1.9",            # type checking
]
# Phase E4 (world inspector): Rich is the TUI presentation layer's
# only dependency. It is an optional extra, NOT a core dependency:
# the inspector's data surfaces (wyrdforge.inspector — state diff,
# entity timeline, contradiction viewer, durable dead-letter
# archaeology, and their plain-text CLI) are stdlib-only, and the
# TUI already degrades gracefully to a simple CLI without Rich.
# Core install therefore stays pydantic + pyyaml.
inspector = [
    "rich>=13.0",           # TUI rendering (wyrdforge.inspector_tui)
]
# NOTE — no [llm] / [full] extras, by standing policy (D3 ruling,
# Volmarr 2026-09-26): sentence-transformers buys zero functionality
# (nothing in the tree imports it — verified 2026-09-26) and
# sqlalchemy is likewise unimported; the extras were the only path
# that could reinstall them by accident ("pip install .[full]").
# The relay's web deps (fastapi/uvicorn/httpx) are NOT declared here
# either — install separately per tools/wyrd_cloud_relay/relay.py
# ("pip install fastapi uvicorn httpx"); the relay degrades
# gracefully without them.

# Phase E2 (SDK publishing fixes): console entry points for the
# repo's real CLIs. The two root CLIs live in src/ as top-level
# modules (shipped via py-modules below) so these entry points import
# from an installed distribution, not just from the repo root; the
# root wyrd_chat_cli.py / wyrd_world_cli.py files are shims that keep
# `python wyrd_chat_cli.py` working. `wyrd-backup` is the Phase A5
# cross-store backup CLI, which already exposed a module main.
[project.scripts]
wyrd-chat = "wyrd_chat_cli:main"
wyrd-world = "wyrd_world_cli:main"
wyrd-backup = "wyrdforge.persistence.backup:main"
# Phase E4 (world inspector): wyrd-inspect is the supported inspector
# CLI (diff / timeline / contradictions / dead-letters / snapshot /
# tui); wyrd-inspect-tui launches the TUI directly.
wyrd-inspect = "wyrdforge.inspector:main"
wyrd-inspect-tui = "wyrdforge.inspector_tui:main"

[tool.setuptools]
py-modules = ["wyrd_chat_cli", "wyrd_world_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
